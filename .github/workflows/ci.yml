name: EchoType CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install pytest ruff numpy==1.26.4 pynput==1.8.2

      - name: Compile sources, tests, and QA tools
        run: python -m compileall -q src tests benchmarks verify.py

      - name: Check fatal Python errors
        run: python -m ruff check --select E9,F63,F7,F82 src tests benchmarks verify.py

      - name: Run tests
        run: python -m pytest -q

  syntax-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse all Python sources without importing Windows/audio dependencies
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = list(Path("src").rglob("*.py"))
          paths += list(Path("tests").rglob("*.py"))
          paths += list(Path("benchmarks").rglob("*.py"))
          paths.append(Path("verify.py"))
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Parsed {len(paths)} Python files successfully")
          PY
